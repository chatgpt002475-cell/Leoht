<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Wedding Consultation | Vowora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FAFBFD] text-gray-800">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-r from-[#e72e76] to-[#ff5277] flex items-center justify-center text-white font-serif font-black text-lg">V</div>
        <span class="text-xl font-black font-serif text-gray-900">Vowora</span>
      </a>
      <a href="index.html" class="text-xs font-bold text-[#e72e76] hover:underline">← Explore Chennai Planners</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-12">
    <div class="bg-white rounded-2xl border border-gray-200 p-8 shadow-xs">
      <div class="text-center mb-6">
        <span class="bg-rose-50 text-rose-600 font-bold text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider">Free Service</span>
        <h1 class="text-2xl font-bold font-serif text-gray-900 mt-2">Book a Wedding Planning Consultation</h1>
        <p class="text-xs text-gray-500 mt-1">Get custom quotes and availability from top-rated Chennai planners.</p>
      </div>

      <form onsubmit="event.preventDefault(); alert('🎉 Your consultation request has been submitted! Our lead wedding advisor will call you shortly on WhatsApp.'); window.location.href='index.html';" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Couple Name(s) *</label>
          <input type="text" required placeholder="Priya & Rahul" class="w-full text-xs p-3 border border-gray-300 rounded-lg outline-none focus:border-rose-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">WhatsApp Mobile *</label>
            <input type="tel" required placeholder="+91 98401 23456" class="w-full text-xs p-3 border border-gray-300 rounded-lg outline-none focus:border-rose-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Estimated Wedding Date *</label>
            <input type="date" required class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none focus:border-rose-500" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Expected Guests</label>
            <select class="w-full text-xs p-3 border border-gray-300 rounded-lg outline-none focus:border-rose-500">
              <option value="100-300">100 - 300 Guests</option>
              <option value="300-600" selected>300 - 600 Guests</option>
              <option value="600-1000">600 - 1000 Guests</option>
              <option value="1000+">1000+ Guests</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Budget Range</label>
            <select class="w-full text-xs p-3 border border-gray-300 rounded-lg outline-none focus:border-rose-500">
              <option value="15-25L">₹15 Lakh - ₹25 Lakh</option>
              <option value="25-50L" selected>₹25 Lakh - ₹50 Lakh</option>
              <option value="50L-1Cr">₹50 Lakh - ₹1 Crore</option>
              <option value="1Cr+">₹1 Crore+ (Luxury Destination)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Preferred Locality / Venue Style</label>
          <input type="text" placeholder="e.g. ECR Beach Resort, Mahabalipuram, or T. Nagar Mandapam" class="w-full text-xs p-3 border border-gray-300 rounded-lg outline-none focus:border-rose-500" />
        </div>
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-[#e72e76] to-[#ff5277] text-white text-xs font-bold rounded-lg shadow-xs hover:opacity-95">
          Schedule Free Consultation
        </button>
      </form>
    </div>
  </main>
</body>
</html>
